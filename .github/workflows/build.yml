name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Workspace Permissions
        run: |
          git config --global --add safe.directory /__w/Axiom/Axiom
          chown -R 1000:1000 .

      - name: Run Buildozer
        run: |
          buildozer -v android debug
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAPK
          path: bin/*.apk
