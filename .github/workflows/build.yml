name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Environment Diagnostic
        run: |
          echo "=== SYSTEM CHECK ==="
          uname -a
          python3 --version
          java -version
          echo "=== CURRENT DIRECTORY ==="
          pwd
          ls -la
