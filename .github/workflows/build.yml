name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Purge Stale Buildozer Caches
        run: |
          sudo rm -rf ~/.buildozer
          sudo mkdir -p ~/.buildozer
          sudo chown -R $USER:$USER ~/.buildozer

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-11-jdk autoconf libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake build-essential ccache lld

      - name: Install Toolchain Base
        run: |
          python -m pip install --upgrade setuptools wheel
          pip install "pip<24.0"
          pip install cython==0.29.33 buildozer==1.5.0 python-for-android==2024.1.21

      - name: Run Buildozer with Venv Pip Interception
        run: |
          set -e
          
          downgrade_venv_pip() {
            local venv_bin=$1
            if [ -f "$venv_bin/pip" ]; then
              echo "📌 Found venv pip at: $venv_bin/pip"
              "$venv_bin/pip" install --upgrade "pip==23.3.1" setuptools wheel 2>&1 | tail -5
              echo "✅ Venv pip pinned to <24.0"
            fi
          }
          
          buildozer -v android debug &
          BUILD_PID=$!
          
          echo "🔍 Monitoring for buildozer venv creation..."
          for i in {1..600}; do
            sleep 1
            
            if [ -f ".buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv/bin/pip" ]; then
              downgrade_venv_pip ".buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/venv/bin"
              break
            elif [ -f ".buildozer/android/platform/build-arm64-v8a/build/venv/bin/pip" ]; then
              downgrade_venv_pip ".buildozer/android/platform/build-arm64-v8a/build/venv/bin"
              break
            elif [ -f ".buildozer/android/platform/build-armeabi-v7a/build/venv/bin/pip" ]; then
              downgrade_venv_pip ".buildozer/android/platform/build-armeabi-v7a/build/venv/bin"
              break
            fi
            
            if ! kill -0 $BUILD_PID 2>/dev/null; then
              wait $BUILD_PID
              exit $?
            fi
          done
          
          wait $BUILD_PID || exit 1
        env:
          PYTHONUNBUFFERED: 1
          CFLAGS: "-Wno-error=format-security -Wno-error=implicit-function-declaration"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAPK
          path: bin/*.apk
