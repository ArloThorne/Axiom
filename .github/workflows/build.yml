name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Purge Stale Buildozer Caches
        run: |
          sudo rm -rf ~/.buildozer
          sudo mkdir -p ~/.buildozer
          sudo chown -R $USER:$USER ~/.buildozer

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-11-jdk autoconf libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake build-essential ccache lld

      - name: Install Toolchain & Pin Pip Wheels
        run: |
          python -m pip install --upgrade setuptools wheel
          pip install pip==23.3.2
          pip install cython==0.29.33
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.14
          # Download a local wheel for 23.3.2 so inner venv creation can reuse it offline/locally without fetching breaking versions
          pip download pip==23.3.2 --no-deps -d /tmp/wheels

      - name: Run Buildozer
        run: |
          buildozer -v android debug
        env:
          PYTHONUNBUFFERED: 1
          CFLAGS: "-Wno-error=format-security -Wno-error=implicit-function-declaration"
          PIP_NO_INDEX: "False"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AxiomAPK
          path: bin/*.apk
